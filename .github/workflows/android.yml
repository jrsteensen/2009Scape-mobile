name: Build Android APK

# Builds an installable APK for review before changes reach master.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and verify APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Android JRE 8
        uses: dawidd6/action-download-artifact@v23
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-pojav
          path: app_pojavlauncher/src/main/assets/components/jre

      - name: Download Android JRE 17
        uses: dawidd6/action-download-artifact@v23
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17
          name: jre17-pojav
          path: app_pojavlauncher/src/main/assets/components/jre-new

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      - name: Build JRE support libraries
        run: |
          ./scripts/languagelist_updater.sh
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build full Android APK
        run: gradle :app_pojavlauncher:assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk \
            out/6Paws-2009scape-Android.apk
          sha256sum out/6Paws-2009scape-Android.apk \
            > out/6Paws-2009scape-Android.apk.sha256

      - name: Verify APK and family server configuration
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose out/6Paws-2009scape-Android.apk
          unzip -p out/6Paws-2009scape-Android.apk assets/config.json > /tmp/client-config.json
          python3 - <<'PY'
          import json
          with open('/tmp/client-config.json', encoding='utf-8') as handle:
              config = json.load(handle)
          assert config['ip_management'] == 'rs.6paws.com'
          assert config['ip_address'] == 'rs.6paws.com'
          assert config['world'] == 1
          assert config['server_port'] == 43594
          PY

      - name: Upload PR test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: 6Paws-2009scape-PR-${{ github.event.pull_request.number }}
          path: |
            out/6Paws-2009scape-Android.apk
            out/6Paws-2009scape-Android.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload master APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: 6Paws-2009scape-Android
          path: |
            out/6Paws-2009scape-Android.apk
            out/6Paws-2009scape-Android.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload branch test APK
        if: github.event_name == 'push' && github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: 6Paws-2009scape-branch-${{ github.run_number }}
          path: |
            out/6Paws-2009scape-Android.apk
            out/6Paws-2009scape-Android.apk.sha256
          if-no-files-found: error
          retention-days: 7
