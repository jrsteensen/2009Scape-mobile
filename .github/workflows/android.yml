name: Build Android APK

# Builds an installable APK for review before changes reach master.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and verify APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Android JRE 8
        uses: dawidd6/action-download-artifact@v23
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
          path: app_pojavlauncher/src/main/assets/components/jre

      - name: Verify bundled Java 8 runtime
        run: |
          RUNTIME_DIR=app_pojavlauncher/src/main/assets/components/jre
          for file in version universal.tar.xz bin-arm.tar.xz bin-arm64.tar.xz bin-x86.tar.xz bin-x86_64.tar.xz; do
            test -s "$RUNTIME_DIR/$file"
          done

      - name: Verify packaged Java linker dependencies
        run: |
          test "$(git hash-object app_pojavlauncher/src/main/jniLibs/armeabi-v7a/libfreetype.so)" = "861d8eed2d7b1631344dcf4bc5684fe10e8bc614"
          test "$(git hash-object app_pojavlauncher/src/main/jniLibs/arm64-v8a/libfreetype.so)" = "4b463d9f4e1604d2f8207ca13f2736f0afdaa379"
          test "$(git hash-object app_pojavlauncher/src/main/jniLibs/x86/libfreetype.so)" = "621719e025b05cd59109f73fe445554096a91636"
          test "$(git hash-object app_pojavlauncher/src/main/jniLibs/x86_64/libfreetype.so)" = "2360a1d559cbb6c55e68a8772f57fdf820402ee1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      - name: Build JRE support libraries
        run: |
          ./scripts/languagelist_updater.sh
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build full Android APK
        run: gradle :app_pojavlauncher:assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk \
            out/6Paws-2009scape-Android.apk
          sha256sum out/6Paws-2009scape-Android.apk \
            > out/6Paws-2009scape-Android.apk.sha256

      - name: Verify APK and family server configuration
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose out/6Paws-2009scape-Android.apk
          python3 - <<'PY'
          import json
          from zipfile import ZipFile

          apk_path = 'out/6Paws-2009scape-Android.apk'
          native_libraries = [
              f'lib/{abi}/libfreetype.so'
              for abi in ('armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64')
          ]
          with ZipFile(apk_path) as apk:
              for path in native_libraries:
                  assert apk.getinfo(path).file_size > 0, f'Missing native dependency: {path}'
              with apk.open('assets/config.json') as handle:
                  config = json.load(handle)
          assert config['ip_management'] == 'rs.6paws.com'
          assert config['ip_address'] == 'rs.6paws.com'
          assert config['world'] == 1
          assert config['server_port'] == 43594
          PY

      - name: Upload PR test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: 6Paws-2009scape-PR-${{ github.event.pull_request.number }}
          path: |
            out/6Paws-2009scape-Android.apk
            out/6Paws-2009scape-Android.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload master APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: 6Paws-2009scape-Android
          path: |
            out/6Paws-2009scape-Android.apk
            out/6Paws-2009scape-Android.apk.sha256
          if-no-files-found: error
          retention-days: 90
